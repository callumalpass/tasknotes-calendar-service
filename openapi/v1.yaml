openapi: 3.1.0
info:
  title: TaskNotes Calendar API
  version: 1.0.0
  description:
    Provider-neutral, stateless calendar read and write contract. The first implementation supports
    Google only.
servers:
  - url: https://calendar.tasknotes.example
security: []
tags:
  - name: Health
  - name: Sign-in
  - name: Connections
  - name: Calendar
  - name: Account
paths:
  /health/live:
    get:
      operationId: healthLive
      tags: [Health]
      responses:
        "200": { $ref: "#/components/responses/Health" }
        "500": { $ref: "#/components/responses/InternalError" }
  /health/ready:
    get:
      operationId: healthReady
      tags: [Health]
      responses:
        "200": { $ref: "#/components/responses/Health" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/sign-in/start:
    post:
      operationId: signInStart
      tags: [Sign-in]
      x-max-body-bytes: 131072
      requestBody: { $ref: "#/components/requestBodies/TransactionStart" }
      responses:
        "201": { $ref: "#/components/responses/TransactionStart" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/sign-in/{transaction_id}/status:
    post:
      operationId: signInStatus
      tags: [Sign-in]
      x-max-body-bytes: 131072
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      requestBody: { $ref: "#/components/requestBodies/TransactionStatus" }
      responses:
        "200": { $ref: "#/components/responses/TransactionStatus" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/sign-in/{transaction_id}/redeem:
    post:
      operationId: signInRedeem
      tags: [Sign-in]
      x-max-body-bytes: 131072
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      requestBody: { $ref: "#/components/requestBodies/SignInRedeem" }
      responses:
        "200":
          description: >-
            A device session. Web sessions receive it only as the Set-Cookie session cookie; other
            clients receive a one-time credential in the body.
          headers:
            {
              Cache-Control: { $ref: "#/components/headers/NoStore" },
              X-Content-Type-Options: { $ref: "#/components/headers/NoSniff" },
              Set-Cookie: { $ref: "#/components/headers/SessionCookie" },
            }
          content:
            { application/json: { schema: { $ref: "#/components/schemas/SignInRedeemResponse" } } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/connections/google/start:
    post:
      operationId: connectStart
      tags: [Connections]
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      x-max-body-bytes: 131072
      requestBody: { $ref: "#/components/requestBodies/TransactionStart" }
      responses:
        "201": { $ref: "#/components/responses/TransactionStart" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/connections/google/{transaction_id}/status:
    post:
      operationId: connectStatus
      tags: [Connections]
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      x-max-body-bytes: 131072
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      requestBody: { $ref: "#/components/requestBodies/TransactionStatus" }
      responses:
        "200": { $ref: "#/components/responses/TransactionStatus" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/connections/google/{transaction_id}/redeem:
    post:
      operationId: connectRedeem
      tags: [Connections]
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      x-max-body-bytes: 131072
      parameters:
        - $ref: "#/components/parameters/TransactionId"
      requestBody: { $ref: "#/components/requestBodies/TransactionRedeem" }
      responses:
        "200":
          description: Connected calendar account.
          headers:
            {
              Cache-Control: { $ref: "#/components/headers/NoStore" },
              X-Content-Type-Options: { $ref: "#/components/headers/NoSniff" },
            }
          content:
            { application/json: { schema: { $ref: "#/components/schemas/ConnectRedeemResponse" } } }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/session:
    get:
      operationId: session
      tags: [Account]
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/connections:
    get:
      operationId: connections
      tags: [Connections]
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        "200": { $ref: "#/components/responses/Connections" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/connections/{connection_id}:
    delete:
      operationId: disconnect
      tags: [Connections]
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/ConnectionId"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/calendars:
    get:
      operationId: calendars
      tags: [Calendar]
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        "200": { $ref: "#/components/responses/Calendars" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/calendars/{calendar_id}/events:
    get:
      operationId: events
      description:
        Reads at most 250 events from one calendar and one provider page for a range no longer than
        93 days.
      tags: [Calendar]
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CalendarId"
        - {
            name: start,
            in: query,
            required: true,
            schema: { $ref: "#/components/schemas/Rfc3339Instant" },
          }
        - {
            name: end,
            in: query,
            required: true,
            schema: { $ref: "#/components/schemas/Rfc3339Instant" },
          }
        - {
            name: cursor,
            in: query,
            required: false,
            schema: { type: string, minLength: 16, maxLength: 4096 },
          }
      responses:
        "200": { $ref: "#/components/responses/Events" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      operationId: createEvent
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CalendarId"
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateEvent" } } }
      responses:
        "201":
          {
            description: Success.,
            content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } },
          }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "500": { $ref: "#/components/responses/InternalError" }
        "403":
          {
            description: permission_denied,
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
  /v1/calendars/{calendar_id}/changes:
    get:
      operationId: changes
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CalendarId"
        - {
            name: cursor,
            in: query,
            required: false,
            schema: { type: string, minLength: 16, maxLength: 4096 },
          }
      description:
        Initial synchronization omits cursor and range filters. One provider page per request.
        Subsequent requests use only the returned cursor; expired sync tokens require restarting.
      responses:
        "200":
          {
            description: Success.,
            content: { application/json: { schema: { $ref: "#/components/schemas/ChangesPage" } } },
          }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "500": { $ref: "#/components/responses/InternalError" }
        "410":
          {
            description: "sync_reset_required; restart without a cursor",
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
  /v1/calendars/{calendar_id}/events/{event_id}:
    get:
      operationId: getEvent
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CalendarId"
        - {
            name: event_id,
            in: path,
            required: true,
            schema: { $ref: "#/components/schemas/EventId" },
          }
      responses:
        "200":
          {
            description: Success.,
            content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } },
          }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      operationId: patchEvent
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CalendarId"
        - {
            name: event_id,
            in: path,
            required: true,
            schema: { $ref: "#/components/schemas/EventId" },
          }
        - {
            name: If-Match,
            in: header,
            required: true,
            schema: { type: string, minLength: 1, maxLength: 256 },
          }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/WriteEvent" } } }
      responses:
        "200":
          {
            description: Success.,
            content: { application/json: { schema: { $ref: "#/components/schemas/Event" } } },
          }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "500": { $ref: "#/components/responses/InternalError" }
        "403":
          {
            description: permission_denied,
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
    delete:
      operationId: deleteEvent
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/CalendarId"
        - {
            name: event_id,
            in: path,
            required: true,
            schema: { $ref: "#/components/schemas/EventId" },
          }
        - {
            name: If-Match,
            in: header,
            required: true,
            schema: { type: string, minLength: 1, maxLength: 256 },
          }
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "500": { $ref: "#/components/responses/InternalError" }
        "403":
          {
            description: permission_denied,
            content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
          }
  /v1/devices:
    get:
      operationId: devices
      tags: [Account]
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        "200": { $ref: "#/components/responses/Devices" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/devices/{device_id}:
    delete:
      operationId: revokeDevice
      tags: [Account]
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /v1/account:
    delete:
      operationId: deleteAccount
      tags: [Account]
      security: [{ bearerAuth: [] }, { sessionCookie: [] }]
      responses:
        "204": { $ref: "#/components/responses/NoContent" }
        "401": { $ref: "#/components/responses/AuthenticationRequired" }
        "500": { $ref: "#/components/responses/InternalError" }
  /oauth/google/callback:
    get:
      operationId: providerCallback
      tags: [Connections]
      description:
        OAuth provider redirect. Exactly one of code or error is required. Unknown callback
        parameters are ignored. Returns a quiet HTML completion or failure page, never a credential.
        Successful sign-in shows a one-time confirmation code for the initiating client.
      parameters:
        - {
            name: state,
            in: query,
            required: true,
            schema: { type: string, pattern: "^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$" },
          }
        - {
            name: code,
            in: query,
            required: false,
            schema: { type: string, minLength: 16, maxLength: 1024 },
          }
        - {
            name: error,
            in: query,
            required: false,
            schema: { type: string, pattern: "^[A-Za-z0-9._~-]{1,128}$" },
          }
      responses:
        "200":
          description: Callback recorded; the initiating client must poll and redeem.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Content-Security-Policy:
              schema: { type: string }
              description: default-src 'none'; inline styles require a per-response nonce.
            X-Content-Type-Options: { $ref: "#/components/headers/NoSniff" }
          content:
            text/html:
              schema: { type: string }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-tasknotes_session
      description: Web sessions only. Every request must carry an allow-listed Origin.
  headers:
    SessionCookie:
      description: HttpOnly web session cookie, set when the redeemed session's client kind is web.
      schema: { type: string }
    NoStore: { schema: { type: string, const: "private, no-store" } }
    NoSniff: { schema: { type: string, const: nosniff } }
    RetryAfter: { schema: { type: integer, minimum: 1, maximum: 300 } }
  parameters:
    TransactionId:
      {
        name: transaction_id,
        in: path,
        required: true,
        schema: { type: string, pattern: "^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$" },
      }
    ConnectionId:
      { name: connection_id, in: path, required: true, schema: { type: string, format: uuid } }
    CalendarId:
      { name: calendar_id, in: path, required: true, schema: { type: string, format: uuid } }
    DeviceId:
      {
        name: device_id,
        in: path,
        required: true,
        schema: { type: string, pattern: "^[A-Za-z0-9_-]{21}[AQgw]$" },
      }
  requestBodies:
    TransactionStatus:
      required: true
      content:
        { application/json: { schema: { $ref: "#/components/schemas/TransactionStatusRequest" } } }
    TransactionStart:
      required: true
      content:
        { application/json: { schema: { $ref: "#/components/schemas/TransactionStartRequest" } } }
    SignInRedeem:
      required: true
      content:
        { application/json: { schema: { $ref: "#/components/schemas/SignInRedeemRequest" } } }
    TransactionRedeem:
      required: true
      content:
        { application/json: { schema: { $ref: "#/components/schemas/TransactionRedeemRequest" } } }
  schemas:
    Rfc3339Instant: { type: string, format: date-time }
    ClientKind: { type: string, enum: [web, ios, android, obsidian] }
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          {
            type: string,
            enum:
              [
                invalid_request,
                unsupported_media_type,
                payload_too_large,
                authentication_required,
                permission_denied,
                resource_not_found,
                conflict,
                sync_reset_required,
                rate_limited,
                dependency_unavailable,
                internal_error,
              ],
          }
        message: { type: string, minLength: 1, maxLength: 160 }
    TransactionStartRequest:
      type: object
      additionalProperties: false
      required: [client_kind, device_name, code_challenge]
      properties:
        client_kind: { $ref: "#/components/schemas/ClientKind" }
        device_name:
          type: string
          minLength: 1
          maxLength: 128
          description: Trimmed, control-character-free, and at most 128 UTF-8 bytes.
          x-max-utf8-bytes: 128
        code_challenge: { type: string, pattern: "^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$" }
    TransactionStartResponse:
      type: object
      additionalProperties: false
      required: [transaction_id, authorization_url, polling_secret, expires_at]
      properties:
        transaction_id: { type: string, pattern: "^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$" }
        authorization_url: { type: string, format: uri, maxLength: 4096 }
        polling_secret: { type: string, pattern: "^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$" }
        expires_at: { $ref: "#/components/schemas/Rfc3339Instant" }
    TransactionStatusRequest:
      type: object
      additionalProperties: false
      required: [polling_secret]
      properties:
        polling_secret: { type: string, pattern: "^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$" }
    SignInRedeemRequest:
      type: object
      additionalProperties: false
      required: [polling_secret, code_verifier, confirmation_code]
      properties:
        polling_secret: { type: string, pattern: "^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$" }
        code_verifier: { type: string, pattern: "^[A-Za-z0-9._~-]{43,128}$" }
        confirmation_code:
          type: string
          pattern: "^[23456789ABCDEFGHJKLMNPQRSTUVWXYZ]{8}$"
          description:
            One-time code shown only in the consent browser. One wrong attempt fails the
            transaction.
    TransactionRedeemRequest:
      type: object
      additionalProperties: false
      required: [polling_secret, code_verifier]
      properties:
        polling_secret: { type: string, pattern: "^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$" }
        code_verifier: { type: string, pattern: "^[A-Za-z0-9._~-]{43,128}$" }
    TransactionStatus:
      oneOf:
        - {
            type: object,
            additionalProperties: false,
            required: [status, expires_at],
            properties:
              {
                status: { const: pending },
                expires_at: { $ref: "#/components/schemas/Rfc3339Instant" },
              },
          }
        - {
            type: object,
            additionalProperties: false,
            required: [status, expires_at],
            properties:
              {
                status: { const: authorized },
                expires_at: { $ref: "#/components/schemas/Rfc3339Instant" },
              },
          }
        - {
            type: object,
            additionalProperties: false,
            required: [status, failure_code],
            properties:
              {
                status: { const: failed },
                failure_code:
                  { type: string, enum: [access_denied, identity_mismatch, authorization_failed] },
              },
          }
        - {
            type: object,
            additionalProperties: false,
            required: [status],
            properties: { status: { const: expired } },
          }
    SessionCredential:
      type: object
      additionalProperties: false
      required: [credential, session_id, idle_expires_at, absolute_expires_at]
      properties:
        credential:
          {
            type: string,
            pattern: "^v1\\.[A-Za-z0-9_-]{21}[AQgw]\\.[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$",
          }
        session_id: { type: string, pattern: "^[A-Za-z0-9_-]{21}[AQgw]$" }
        idle_expires_at: { $ref: "#/components/schemas/Rfc3339Instant" }
        absolute_expires_at: { $ref: "#/components/schemas/Rfc3339Instant" }
    WebSession:
      type: object
      additionalProperties: false
      required: [session_id, idle_expires_at, absolute_expires_at]
      properties:
        session_id: { type: string, pattern: "^[A-Za-z0-9_-]{21}[AQgw]$" }
        idle_expires_at: { $ref: "#/components/schemas/Rfc3339Instant" }
        absolute_expires_at: { $ref: "#/components/schemas/Rfc3339Instant" }
    SignInRedeemResponse:
      type: object
      additionalProperties: false
      required: [session]
      properties:
        session:
          oneOf:
            - { $ref: "#/components/schemas/SessionCredential" }
            - { $ref: "#/components/schemas/WebSession" }
    ConnectRedeemResponse:
      type: object
      additionalProperties: false
      required: [connection_id, status]
      properties: { connection_id: { type: string, format: uuid }, status: { const: active } }
    Session:
      type: object
      additionalProperties: false
      required:
        [
          principal_id,
          session_id,
          client_kind,
          device_name,
          created_at,
          idle_expires_at,
          absolute_expires_at,
        ]
      properties:
        principal_id: { type: string, format: uuid }
        session_id: { type: string, pattern: "^[A-Za-z0-9_-]{21}[AQgw]$" }
        client_kind: { $ref: "#/components/schemas/ClientKind" }
        device_name:
          type: string
          minLength: 1
          maxLength: 128
          description: Trimmed, control-character-free, and at most 128 UTF-8 bytes.
          x-max-utf8-bytes: 128
        created_at: { $ref: "#/components/schemas/Rfc3339Instant" }
        idle_expires_at: { $ref: "#/components/schemas/Rfc3339Instant" }
        absolute_expires_at: { $ref: "#/components/schemas/Rfc3339Instant" }
    Connection:
      type: object
      additionalProperties: false
      required: [id, provider, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, const: google }
        status: { type: string, enum: [active, reconnect_required] }
        created_at: { $ref: "#/components/schemas/Rfc3339Instant" }
        updated_at: { $ref: "#/components/schemas/Rfc3339Instant" }
    Calendar:
      type: object
      additionalProperties: false
      required: [id, connection_id, name, description, can_write, time_zone, is_primary]
      properties:
        id: { type: string, format: uuid }
        connection_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 500 }
        description: { type: [string, "null"], maxLength: 4000 }
        can_write: { type: boolean }
        time_zone: { type: [string, "null"], maxLength: 100 }
        is_primary: { type: boolean }
    EventId:
      type: string
      pattern: "^e1_[A-Za-z0-9_-]{39,1403}$"
      maxLength: 1406
    WriteEvent:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, maxLength: 1000 }
        description: { type: string, maxLength: 16000 }
        location: { type: string, maxLength: 1000 }
        start: { $ref: "#/components/schemas/EventBoundary" }
        end: { $ref: "#/components/schemas/EventBoundary" }
        transparency: { enum: [opaque, transparent] }
        recurrence:
          type: array
          maxItems: 32
          x-max-json-utf8-bytes: 16384
          items:
            {
              type: string,
              minLength: 1,
              maxLength: 2048,
              pattern: '^(?:RRULE|EXDATE|RDATE)(?:;[^:\r\n]+)?:[^\r\n]+$',
            }
    CreateEvent:
      type: object
      additionalProperties: false
      required: [idempotency_key, start, end]
      properties:
        idempotency_key: { type: string, format: uuid }
        title: { type: string, maxLength: 1000 }
        description: { type: string, maxLength: 16000 }
        location: { type: string, maxLength: 1000 }
        start: { $ref: "#/components/schemas/EventBoundary" }
        end: { $ref: "#/components/schemas/EventBoundary" }
        transparency: { enum: [opaque, transparent] }
        recurrence: { $ref: "#/components/schemas/WriteEvent/properties/recurrence" }
    ChangesPage:
      type: object
      additionalProperties: false
      required: [events, omitted_count, next_cursor, sync_cursor]
      description: Exactly one cursor is non-null. Follow next_cursor until sync_cursor is returned.
      properties:
        events: { type: array, maxItems: 250, items: { $ref: "#/components/schemas/Event" } }
        omitted_count: { type: integer, minimum: 0, maximum: 250 }
        next_cursor: { type: [string, "null"], minLength: 16, maxLength: 4096 }
        sync_cursor: { type: [string, "null"], minLength: 16, maxLength: 4096 }
    EventBoundary:
      description:
        A timed instant or an all-day date. An all-day end date is preserved exactly from Google and
        is exclusive.
      oneOf:
        - {
            type: object,
            additionalProperties: false,
            required: [kind, date],
            properties: { kind: { const: date }, date: { type: string, format: date } },
          }
        - {
            type: object,
            additionalProperties: false,
            required: [kind, date_time],
            properties:
              {
                kind: { const: date_time },
                date_time: { $ref: "#/components/schemas/Rfc3339Instant" },
                time_zone: { type: string, minLength: 1, maxLength: 100 },
              },
          }
    EventRecurrence:
      type: object
      additionalProperties: false
      required: [series_id, original_start]
      properties:
        series_id:
          {
            $ref: "#/components/schemas/EventId",
            description: Opaque deterministic series identifier.,
          }
        original_start: { $ref: "#/components/schemas/EventBoundary" }
    Event:
      description:
        Provider-neutral event with opaque deterministic identifiers. Boundary kinds match and every
        present interval does not decrease; zero-duration events are valid.
      oneOf:
        - $ref: "#/components/schemas/ConfirmedEvent"
        - $ref: "#/components/schemas/TentativeEvent"
        - $ref: "#/components/schemas/CancelledEvent"
      discriminator: { propertyName: status }
    ConfirmedEvent:
      type: object
      additionalProperties: false
      required:
        [
          id,
          etag,
          calendar_id,
          status,
          title,
          description,
          location,
          start,
          end,
          updated_at,
          recurrence,
        ]
      properties:
        id:
          {
            $ref: "#/components/schemas/EventId",
            description: Opaque deterministic event identifier.,
          }
        etag: { type: string, minLength: 1, maxLength: 256 }
        calendar_id: { type: string, format: uuid, description: Server-resolved calendar locator. }
        status: { const: confirmed }
        title: { type: [string, "null"], maxLength: 1000 }
        description: { type: [string, "null"], maxLength: 16000 }
        location: { type: [string, "null"], maxLength: 1000 }
        start: { $ref: "#/components/schemas/EventBoundary" }
        end: { $ref: "#/components/schemas/EventBoundary" }
        updated_at: { $ref: "#/components/schemas/Rfc3339Instant" }
        recurrence: { oneOf: [{ $ref: "#/components/schemas/EventRecurrence" }, { type: "null" }] }
    TentativeEvent:
      type: object
      additionalProperties: false
      required:
        [
          id,
          etag,
          calendar_id,
          status,
          title,
          description,
          location,
          start,
          end,
          updated_at,
          recurrence,
        ]
      properties:
        id:
          {
            $ref: "#/components/schemas/EventId",
            description: Opaque deterministic event identifier.,
          }
        etag: { type: string, minLength: 1, maxLength: 256 }
        calendar_id: { type: string, format: uuid, description: Server-resolved calendar locator. }
        status: { const: tentative }
        title: { type: [string, "null"], maxLength: 1000 }
        description: { type: [string, "null"], maxLength: 16000 }
        location: { type: [string, "null"], maxLength: 1000 }
        start: { $ref: "#/components/schemas/EventBoundary" }
        end: { $ref: "#/components/schemas/EventBoundary" }
        updated_at: { $ref: "#/components/schemas/Rfc3339Instant" }
        recurrence: { oneOf: [{ $ref: "#/components/schemas/EventRecurrence" }, { type: "null" }] }
    CancelledEvent:
      description: Tombstone with either a complete valid interval or two null boundaries.
      oneOf:
        - $ref: "#/components/schemas/CancelledEventWithInterval"
        - $ref: "#/components/schemas/CancelledEventWithoutInterval"
    CancelledEventWithInterval:
      type: object
      additionalProperties: false
      required:
        [
          id,
          etag,
          calendar_id,
          status,
          title,
          description,
          location,
          start,
          end,
          updated_at,
          recurrence,
        ]
      properties:
        id:
          {
            $ref: "#/components/schemas/EventId",
            description: Opaque deterministic event identifier.,
          }
        etag: { type: [string, "null"], minLength: 1, maxLength: 256 }
        calendar_id: { type: string, format: uuid, description: Server-resolved calendar locator. }
        status: { const: cancelled }
        title: { type: [string, "null"], maxLength: 1000 }
        description: { type: [string, "null"], maxLength: 16000 }
        location: { type: [string, "null"], maxLength: 1000 }
        start: { $ref: "#/components/schemas/EventBoundary" }
        end: { $ref: "#/components/schemas/EventBoundary" }
        updated_at: { oneOf: [{ $ref: "#/components/schemas/Rfc3339Instant" }, { type: "null" }] }
        recurrence: { oneOf: [{ $ref: "#/components/schemas/EventRecurrence" }, { type: "null" }] }
    CancelledEventWithoutInterval:
      type: object
      additionalProperties: false
      required:
        [
          id,
          etag,
          calendar_id,
          status,
          title,
          description,
          location,
          start,
          end,
          updated_at,
          recurrence,
        ]
      properties:
        id:
          {
            $ref: "#/components/schemas/EventId",
            description: Opaque deterministic event identifier.,
          }
        etag: { type: [string, "null"], minLength: 1, maxLength: 256 }
        calendar_id: { type: string, format: uuid, description: Server-resolved calendar locator. }
        status: { const: cancelled }
        title: { type: [string, "null"], maxLength: 1000 }
        description: { type: [string, "null"], maxLength: 16000 }
        location: { type: [string, "null"], maxLength: 1000 }
        start: { type: "null" }
        end: { type: "null" }
        updated_at: { oneOf: [{ $ref: "#/components/schemas/Rfc3339Instant" }, { type: "null" }] }
        recurrence: { oneOf: [{ $ref: "#/components/schemas/EventRecurrence" }, { type: "null" }] }
    Device:
      type: object
      additionalProperties: false
      required: [id, client_kind, device_name, created_at, last_used_at, current]
      properties:
        id: { type: string, pattern: "^[A-Za-z0-9_-]{21}[AQgw]$" }
        client_kind: { $ref: "#/components/schemas/ClientKind" }
        device_name:
          type: string
          minLength: 1
          maxLength: 128
          description: Trimmed, control-character-free, and at most 128 UTF-8 bytes.
          x-max-utf8-bytes: 128
        created_at: { $ref: "#/components/schemas/Rfc3339Instant" }
        last_used_at: { $ref: "#/components/schemas/Rfc3339Instant" }
        current: { type: boolean }
  responses:
    Health:
      description: Health status.
      headers:
        {
          Cache-Control: { $ref: "#/components/headers/NoStore" },
          X-Content-Type-Options: { $ref: "#/components/headers/NoSniff" },
        }
      content:
        {
          application/json:
            {
              schema:
                {
                  type: object,
                  additionalProperties: false,
                  required: [status],
                  properties: { status: { type: string, enum: [ok, ready] } },
                },
            },
        }
    TransactionStart:
      description: Short-lived browser authorization transaction.
      headers:
        {
          Cache-Control: { $ref: "#/components/headers/NoStore" },
          X-Content-Type-Options: { $ref: "#/components/headers/NoSniff" },
        }
      content:
        { application/json: { schema: { $ref: "#/components/schemas/TransactionStartResponse" } } }
    TransactionStatus:
      description: Privacy-safe transaction status.
      headers:
        {
          Cache-Control: { $ref: "#/components/headers/NoStore" },
          X-Content-Type-Options: { $ref: "#/components/headers/NoSniff" },
        }
      content: { application/json: { schema: { $ref: "#/components/schemas/TransactionStatus" } } }
    Session:
      description: Current device session.
      headers:
        {
          Cache-Control: { $ref: "#/components/headers/NoStore" },
          X-Content-Type-Options: { $ref: "#/components/headers/NoSniff" },
        }
      content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } }
    Connections:
      description: Calendar connections. The first slice has at most one.
      headers:
        {
          Cache-Control: { $ref: "#/components/headers/NoStore" },
          X-Content-Type-Options: { $ref: "#/components/headers/NoSniff" },
        }
      content:
        {
          application/json:
            {
              schema:
                {
                  type: object,
                  additionalProperties: false,
                  required: [connections],
                  properties:
                    {
                      connections:
                        {
                          type: array,
                          maxItems: 1,
                          items: { $ref: "#/components/schemas/Connection" },
                        },
                    },
                },
            },
        }
    Calendars:
      description: Server-owned calendar resources.
      headers:
        {
          Cache-Control: { $ref: "#/components/headers/NoStore" },
          X-Content-Type-Options: { $ref: "#/components/headers/NoSniff" },
        }
      content:
        {
          application/json:
            {
              schema:
                {
                  type: object,
                  additionalProperties: false,
                  required: [calendars],
                  properties:
                    {
                      calendars:
                        {
                          type: array,
                          maxItems: 250,
                          items: { $ref: "#/components/schemas/Calendar" },
                        },
                    },
                },
            },
        }
    Events:
      description: One bounded normalized event page.
      headers:
        {
          Cache-Control: { $ref: "#/components/headers/NoStore" },
          X-Content-Type-Options: { $ref: "#/components/headers/NoSniff" },
        }
      content:
        {
          application/json:
            {
              schema:
                {
                  type: object,
                  additionalProperties: false,
                  required: [events, next_cursor, omitted_count],
                  properties:
                    {
                      omitted_count: { type: integer, minimum: 0, maximum: 250 },
                      events:
                        {
                          type: array,
                          maxItems: 250,
                          items: { $ref: "#/components/schemas/Event" },
                        },
                      next_cursor: { type: [string, "null"], minLength: 16, maxLength: 4096 },
                    },
                },
            },
        }
    Devices:
      description: Device sessions.
      headers:
        {
          Cache-Control: { $ref: "#/components/headers/NoStore" },
          X-Content-Type-Options: { $ref: "#/components/headers/NoSniff" },
        }
      content:
        {
          application/json:
            {
              schema:
                {
                  type: object,
                  additionalProperties: false,
                  required: [devices],
                  properties:
                    {
                      devices:
                        {
                          type: array,
                          maxItems: 100,
                          items: { $ref: "#/components/schemas/Device" },
                        },
                    },
                },
            },
        }
    NoContent:
      description: Completed. No response body.
      headers:
        {
          Cache-Control: { $ref: "#/components/headers/NoStore" },
          X-Content-Type-Options: { $ref: "#/components/headers/NoSniff" },
        }
    InvalidRequest: { $ref: "#/components/responses/Error400" }
    UnsupportedMediaType: { $ref: "#/components/responses/Error415" }
    PayloadTooLarge: { $ref: "#/components/responses/Error413" }
    AuthenticationRequired: { $ref: "#/components/responses/Error401" }
    NotFound: { $ref: "#/components/responses/Error404" }
    Conflict: { $ref: "#/components/responses/Error409" }
    InternalError: { $ref: "#/components/responses/Error500" }
    Error400:
      {
        description: Request is invalid.,
        headers:
          {
            Cache-Control: { $ref: "#/components/headers/NoStore" },
            X-Content-Type-Options: { $ref: "#/components/headers/NoSniff" },
          },
        content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
      }
    Error401:
      {
        description: Authentication is required.,
        headers:
          {
            Cache-Control: { $ref: "#/components/headers/NoStore" },
            X-Content-Type-Options: { $ref: "#/components/headers/NoSniff" },
          },
        content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
      }
    Error404:
      {
        description: Resource is absent or unavailable to this principal.,
        headers:
          {
            Cache-Control: { $ref: "#/components/headers/NoStore" },
            X-Content-Type-Options: { $ref: "#/components/headers/NoSniff" },
          },
        content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
      }
    Error409:
      {
        description: Request conflicts with current state.,
        headers:
          {
            Cache-Control: { $ref: "#/components/headers/NoStore" },
            X-Content-Type-Options: { $ref: "#/components/headers/NoSniff" },
          },
        content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
      }
    Error413:
      {
        description: JSON body exceeds the route's byte limit.,
        headers:
          {
            Cache-Control: { $ref: "#/components/headers/NoStore" },
            X-Content-Type-Options: { $ref: "#/components/headers/NoSniff" },
          },
        content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
      }
    Error415:
      {
        description: Content type is not application/json.,
        headers:
          {
            Cache-Control: { $ref: "#/components/headers/NoStore" },
            X-Content-Type-Options: { $ref: "#/components/headers/NoSniff" },
          },
        content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
      }
    Error500:
      {
        description: Internal invariant failure.,
        headers:
          {
            Cache-Control: { $ref: "#/components/headers/NoStore" },
            X-Content-Type-Options: { $ref: "#/components/headers/NoSniff" },
          },
        content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } },
      }
    RateLimited:
      description: Rate limit reached.
      headers:
        {
          Cache-Control: { $ref: "#/components/headers/NoStore" },
          X-Content-Type-Options: { $ref: "#/components/headers/NoSniff" },
          Retry-After: { $ref: "#/components/headers/RetryAfter" },
        }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unavailable:
      description: A required dependency is temporarily unavailable.
      headers:
        {
          Cache-Control: { $ref: "#/components/headers/NoStore" },
          X-Content-Type-Options: { $ref: "#/components/headers/NoSniff" },
          Retry-After: { $ref: "#/components/headers/RetryAfter" },
        }
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
