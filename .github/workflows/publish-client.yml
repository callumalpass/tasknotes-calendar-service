name: Publish client

# Publishes @tasknotes/calendar-service-client from client/. Push a tag
# `client-v<version>` that matches client/package.json.
on:
  push:
    tags: ["client-v*"]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  npm:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      # npm's trusted publishing needs npm 11.5.1 or later, which Node 24 carries.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify tag and package version
        shell: bash
        run: |
          package_version="$(node -p "require('./client/package.json').version")"
          test "${GITHUB_REF_NAME#client-v}" = "$package_version"
      - name: Build
        run: pnpm client:build
      # Trusted publishing from a public repository attests provenance by itself.
      - name: Publish with OIDC trusted publishing
        shell: bash
        working-directory: client
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$package_version" == *-* ]]; then
            npm publish --access public --tag next
          else
            npm publish --access public --tag latest
          fi
